name: fl_panel
description: "A docking layout for Flutter: a tree of splits, panels and tab groups you can resize, dock and persist, with ordinary Flutter widgets inside every panel."
version: 1.1.0
repository: https://github.com/WilliamKarolDiCioccio/fl_panel
platforms:
  web:
  linux:
  windows:
  macos:
funding:
  - https://buymeacoffee.com/Wilielmus

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
